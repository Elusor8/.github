name: Reusable CI

on:
  workflow_call:
    inputs:
      profile:
        description: Approved ZipViz CI profile
        required: true
        type: string
      runtime-version:
        description: Node or Python version
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate approved profile
        env:
          CI_PROFILE: ${{ inputs.profile }}
        run: |
          case "$CI_PROFILE" in
            node-api|node-workers|node-mcp|node-site|python-service) ;;
            *) echo "::error::unknown CI profile: $CI_PROFILE"; exit 2 ;;
          esac

      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node v4
      - name: Set up Node
        if: startsWith(inputs.profile, 'node-')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.runtime-version }}
          cache: npm

      # actions/setup-python v5
      - name: Set up Python
        if: inputs.profile == 'python-service'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.runtime-version }}
          cache: pip

      - name: Install Node dependencies
        if: startsWith(inputs.profile, 'node-')
        run: npm ci

      - name: Install Python package and test dependencies
        if: inputs.profile == 'python-service'
        run: python -m pip install -e '.[dev]'

      - name: API guardrails
        if: inputs.profile == 'node-api'
        run: |
          npm run lint:sprint-guardrails
          npm run test:lint

      - name: Site lint
        if: inputs.profile == 'node-site'
        run: npm run lint

      - name: Typecheck
        if: inputs.profile == 'node-api' || inputs.profile == 'node-workers' || inputs.profile == 'node-site'
        run: npm run typecheck

      - name: Node tests
        if: startsWith(inputs.profile, 'node-')
        run: npm test

      - name: Worker bridge tests
        if: inputs.profile == 'node-workers'
        run: npm run test:bridge

      - name: Python tests
        if: inputs.profile == 'python-service'
        run: python -m pytest -q

      - name: Build
        if: inputs.profile == 'node-mcp' || inputs.profile == 'node-site'
        run: npm run build
